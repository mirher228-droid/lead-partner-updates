name: Verify published Common 1.2.51 channel

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-common-1.2.51.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-channel:
    name: Run existing channel publication and verify public downloads
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # This workflow has no release mutation step and holds no publication lock.
    # The existing channel workflow owns the stable-channel lock.
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mirher228-droid/lead-partner-updates
      EXPECTED_COMMIT: fb713f52e2e17eb9ec8ccb4d451889ede1ef93a6
      EXPECTED_ARCHIVE_SHA256: 492da594fe9791a37bfe4a9a235a792da56f6fb3dfb262704f758b408cf14dac
      EXPECTED_ARCHIVE_SIZE: 525177
      # Exact file hashes from the already validated Windows setup payload.
      EXPECTED_SETUP_CONTENTS: '{"Build-SilentRunner.ps1":"143932d0f6ad117375a31078a8b36c6d16810bbdc07322d8c15998a05d86b152","Install-AutoUpdate.bat":"44676268c078ccc4ac772159faf060d9393e47e4125af2d3c6184082c71ef5b2","Install-AutoUpdate.ps1":"ae91c0b12ef9b19e001364cbd617ff6347088491d1db429d5f4be38e820f6b10","README-RU.txt":"2fae73eef66adba3c97edb9c387ee7abec45465ecbcea3a02faf80d104c52718","SilentRunner.cs":"40b1e27f3a7bfcdc0fc733529f65212305652965c91f818b3e80a8cb8a031777","Uninstall-AutoUpdate.bat":"28eeffb3b2eac1f9c9ef9569ba655aa2d55c4c86a7e0495bcea18e473c1d9558","Uninstall-AutoUpdate.ps1":"68cd1334e1487ba52226ef623966ae2a5e9f8fd65d1fe630a93e759079697ca3","Update-LeadPartner.ps1":"a4b5ae5a4a7a4da7102f78f126c7234a238e0a048766c248bbe50d65628406e7","Updater.Core.ps1":"3cac0bfdc9b9f906fac28665a5ca112c7fc9645be443256eea138b5b3ce362b3"}'
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb713f52e2e17eb9ec8ccb4d451889ede1ef93a6
          persist-credentials: false
      - name: Dispatch and await the existing release-common workflow on the release tag
        id: existing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $detail = @($_.Exception.Message,$_.InvocationInfo.PositionMessage,$_.ScriptStackTrace) -join "`n"
            if ($detail.Length -gt 16000) { $detail = $detail.Substring(0,16000) }
            for ($offset=0; $offset -lt $detail.Length; $offset+=500) {
              $chunk = $detail.Substring($offset,[Math]::Min(500,$detail.Length-$offset)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output ('::error title=Common release failure::' + $chunk)
            }
            exit 1
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'common-v1.2.51'
          $resolvedCommit = gh api "repos/$env:GH_REPO/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $resolvedCommit -cne $env:EXPECTED_COMMIT) { throw 'The published tag does not resolve to the tested commit.' }
          # Prove the already public archive is still the approved immutable asset
          # before asking the existing workflow to regenerate setup/channel files.
          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the published release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.id -ne 445039752 -or $release.tag_name -cne $tag -or $release.draft -ne $false -or $release.prerelease -ne $false -or $release.target_commitish -cne $env:EXPECTED_COMMIT) { throw 'The published release identity changed.' }
          $archive = @($release.assets | Where-Object { $_.name -ceq 'Lead-Partner-Common-1.2.51.zip' })
          if ($archive.Count -ne 1 -or $archive[0].id -ne 746419755 -or $archive[0].size -ne [int64]$env:EXPECTED_ARCHIVE_SIZE -or $archive[0].digest -cne ('sha256:' + $env:EXPECTED_ARCHIVE_SHA256)) { throw 'The immutable Common archive changed before channel verification.' }
          $latestId = gh api "repos/$env:GH_REPO/releases/latest" --jq '.id'
          if ($LASTEXITCODE -ne 0 -or $latestId -cne '445039752') { throw 'Another stable release replaced the approved public channel.' }
          $beforeJson = gh run list --repo $env:GH_REPO --workflow release-common.yml --event workflow_dispatch --commit $env:EXPECTED_COMMIT --limit 100 --json databaseId
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect prior channel workflow runs.' }
          $knownIds = @($beforeJson | ConvertFrom-Json | ForEach-Object { [string]$_.databaseId })
          $dispatchAt = [DateTimeOffset]::FromUnixTimeSeconds([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          gh workflow run release-common.yml --repo $env:GH_REPO --ref $tag -f "tag=$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot dispatch the required existing channel workflow.' }
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(3)
          $channelRun = $null
          do {
            $runsJson = gh run list --repo $env:GH_REPO --workflow release-common.yml --event workflow_dispatch --commit $env:EXPECTED_COMMIT --limit 100 --json databaseId,headSha,event,createdAt,status,conclusion
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the dispatched channel workflow.' }
            $candidates = @($runsJson | ConvertFrom-Json | Where-Object { $_.event -ceq 'workflow_dispatch' -and $_.headSha -ceq $env:EXPECTED_COMMIT -and ([DateTimeOffset]$_.createdAt) -ge $dispatchAt -and [string]$_.databaseId -notin $knownIds })
            if ($candidates.Count -gt 1) { throw 'More than one new exact-commit channel run appeared; refusing to guess which run to trust.' }
            if ($candidates.Count -eq 1) { $channelRun = $candidates[0]; break }
            Start-Sleep -Seconds 10
          } while ([DateTimeOffset]::UtcNow -lt $deadline)
          if ($null -eq $channelRun -or [string]$channelRun.databaseId -notmatch '^[1-9][0-9]*$') { throw 'The exact-commit channel workflow did not appear.' }
          gh run watch $channelRun.databaseId --repo $env:GH_REPO --interval 10 --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'The existing release-common verification failed.' }
          $completedJson = gh run view $channelRun.databaseId --repo $env:GH_REPO --json headSha,event,status,conclusion,jobs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot confirm the completed channel jobs.' }
          $completed = $completedJson | ConvertFrom-Json
          $publishJobs = @($completed.jobs | Where-Object { $_.name -ceq 'Validate Common ZIP and publish channel assets' })
          if ($completed.headSha -cne $env:EXPECTED_COMMIT -or $completed.event -cne 'workflow_dispatch' -or $completed.status -cne 'completed' -or $completed.conclusion -cne 'success' -or $publishJobs.Count -ne 1 -or $publishJobs[0].conclusion -cne 'success') { throw 'The exact channel publish job did not succeed.' }
          "run_id=$($channelRun.databaseId)" >> $env:GITHUB_OUTPUT
      - name: Verify latest stable metadata and anonymous channel, ZIP and setup downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $detail = @($_.Exception.Message,$_.InvocationInfo.PositionMessage,$_.ScriptStackTrace) -join "`n"
            if ($detail.Length -gt 16000) { $detail = $detail.Substring(0,16000) }
            for ($offset=0; $offset -lt $detail.Length; $offset+=500) {
              $chunk = $detail.Substring($offset,[Math]::Min(500,$detail.Length-$offset)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output ('::error title=Common release failure::' + $chunk)
            }
            exit 1
          }
          $PSNativeCommandUseErrorActionPreference = $false
          . ./tools/Release.Common.ps1
          $tag = 'common-v1.2.51'
          $latestJson = gh api "repos/$env:GH_REPO/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot confirm the final latest release.' }
          $latest = $latestJson | ConvertFrom-Json
          $metadata = Test-CommonReleaseMetadata -Release $latest -ExpectedTag $tag -LatestTag $latest.tag_name
          if ($latest.target_commitish -cne $env:EXPECTED_COMMIT -or $metadata.AssetSize -ne [int64]$env:EXPECTED_ARCHIVE_SIZE) { throw 'Final release commit or archive metadata changed.' }
          $assetNames = @($latest.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($assetNames -join '|') -cne 'Lead-Partner-Common-1.2.51.zip|Lead-Partner-Common-AutoUpdate-Setup.zip|update.json') { throw 'The final release must expose the three approved Common assets.' }
          $verifyDirectory = Join-Path $env:RUNNER_TEMP ('public-common-1.2.51-' + $env:GITHUB_RUN_ID)
          [IO.Directory]::CreateDirectory($verifyDirectory) | Out-Null
          $channelPath = Join-Path $verifyDirectory 'update.json'
          Invoke-WebRequest -Uri "https://github.com/$env:GH_REPO/releases/latest/download/update.json" -OutFile $channelPath -TimeoutSec 120
          $channel = Get-Content -LiteralPath $channelPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $expectedArchiveUrl = "https://github.com/$env:GH_REPO/releases/download/$tag/Lead-Partner-Common-1.2.51.zip"
          if ($channel.schema -ne 1 -or $channel.channel -cne 'common' -or $channel.repository -cne $env:GH_REPO -or $channel.version -cne '1.2.51' -or $channel.archive.url -cne $expectedArchiveUrl -or $channel.archive.sha256 -cne $env:EXPECTED_ARCHIVE_SHA256 -or $channel.archive.size -ne [int64]$env:EXPECTED_ARCHIVE_SIZE) { throw 'The public latest channel does not pin the tested Common archive.' }
          $archivePath = Join-Path $verifyDirectory 'Lead-Partner-Common-1.2.51.zip'
          Invoke-WebRequest -Uri $expectedArchiveUrl -OutFile $archivePath -TimeoutSec 120
          if ((Get-Item -LiteralPath $archivePath).Length -ne [int64]$env:EXPECTED_ARCHIVE_SIZE) { throw 'The public archive size changed.' }
          Test-CommonArchive -ArchivePath $archivePath -Version '1.2.51' -ReleaseTag $tag -ExpectedSha256 $env:EXPECTED_ARCHIVE_SHA256 | Out-Null
          $setupPath = Join-Path $verifyDirectory 'Lead-Partner-Common-AutoUpdate-Setup.zip'
          Invoke-WebRequest -Uri "https://github.com/$env:GH_REPO/releases/download/$tag/Lead-Partner-Common-AutoUpdate-Setup.zip" -OutFile $setupPath -TimeoutSec 120
          $setup = [IO.Compression.ZipFile]::OpenRead($setupPath)
          try {
            $expectedNames = @('Updater.Core.ps1','Update-LeadPartner.ps1','Install-AutoUpdate.ps1','Install-AutoUpdate.bat','Uninstall-AutoUpdate.ps1','Uninstall-AutoUpdate.bat','README-RU.txt','SilentRunner.cs','Build-SilentRunner.ps1') | Sort-Object
            $actualNames = @($setup.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if ($actualNames.Count -ne 9 -or @(Compare-Object $actualNames $expectedNames -CaseSensitive).Count -ne 0) { throw 'The public setup contains unexpected files.' }
            $expectedContents = $env:EXPECTED_SETUP_CONTENTS | ConvertFrom-Json
            if (@($expectedContents.PSObject.Properties).Count -ne 9) { throw 'The Windows setup hash manifest is incomplete.' }
            foreach ($name in $expectedNames) {
              $stream = $setup.GetEntry($name).Open()
              $algorithm = [Security.Cryptography.SHA256]::Create()
              try { $hash = [Convert]::ToHexString($algorithm.ComputeHash($stream)).ToLowerInvariant() } finally { $algorithm.Dispose(); $stream.Dispose() }
              if ($hash -cne $expectedContents.PSObject.Properties[$name].Value) { throw ('Public setup differs from the tested Windows client source: ' + $name) }
            }
          } finally { $setup.Dispose() }
          $finalLatestJson = gh api "repos/$env:GH_REPO/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot perform the final stable channel check.' }
          $finalLatest = $finalLatestJson | ConvertFrom-Json
          if ($finalLatest.tag_name -cne $tag -or $finalLatest.draft -ne $false -or $finalLatest.prerelease -ne $false -or $finalLatest.target_commitish -cne $env:EXPECTED_COMMIT) { throw 'Another release replaced the channel during verification.' }
          $finalCommit = gh api "repos/$env:GH_REPO/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $finalCommit -cne $env:EXPECTED_COMMIT) { throw 'The release tag moved during public verification.' }
          "Common 1.2.51 stable release verified: https://github.com/$env:GH_REPO/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
          "Existing channel workflow verified: https://github.com/$env:GH_REPO/actions/runs/${{ steps.existing.outputs.run_id }}" >> $env:GITHUB_STEP_SUMMARY
          "Archive SHA-256: $env:EXPECTED_ARCHIVE_SHA256; bytes: $env:EXPECTED_ARCHIVE_SIZE." >> $env:GITHUB_STEP_SUMMARY
          'Employees with the updater receive this package on their next check; installation waits for the browser to close completely.' >> $env:GITHUB_STEP_SUMMARY
