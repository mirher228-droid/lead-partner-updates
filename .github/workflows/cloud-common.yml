name: Build Common from editable sources
on:
  push:
    branches: [main]
    paths: ['extension/**', 'tools/build_common.py', 'tools/*.cjs', 'tests/**', '.github/workflows/cloud-common.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package regression checks
        run: python -m unittest discover -s tests -p test_cloud_build.py
      - name: Panel reliability and browser recovery checks
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          $taskNodeLog = Join-Path $env:RUNNER_TEMP 'common-node-tests.log'
          node --test --test-reporter=spec 2>&1 | Tee-Object -FilePath $taskNodeLog
          $taskNodeExit = $LASTEXITCODE
          if ($taskNodeExit -ne 0) {
            $taskFailure = (Get-Content -LiteralPath $taskNodeLog -Tail 90) -join "`n"
            if ($taskFailure.Length -gt 18000) { $taskFailure = $taskFailure.Substring($taskFailure.Length - 18000) }
            for ($taskOffset = 0; $taskOffset -lt $taskFailure.Length; $taskOffset += 2000) {
              $taskChunk = $taskFailure.Substring($taskOffset, [Math]::Min(2000, $taskFailure.Length - $taskOffset))
              $taskEscaped = $taskChunk.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Common Node assertion details::$taskEscaped"
            }
            exit $taskNodeExit
          }
      - name: Retain failed Node diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: common-node-failure-log
          path: ${{ runner.temp }}/common-node-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Build and syntax-check Common
        run: python tools/build_common.py
      - name: Validate exact package with stable release policy
        shell: powershell
        run: |
          . ./tools/Release.Common.ps1
          $version = (Get-Content extension/manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          Test-CommonArchive -ArchivePath "./dist/Lead-Partner-Common-$version.zip" -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: common-test-build
          path: dist/Lead-Partner-Common-*.zip
          retention-days: 14

# Artifacts only: this workflow cannot publish releases or update employee feeds.
